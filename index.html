<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search - Pharmacy</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Neubrutalism theme */
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f6f6f6;
        }
        .neubrutalism {
            background-color: #ffffff;
            border: 3px solid #000000;
            box-shadow: 6px 6px 0 #000000;
            transition: all 0.2s ease;
        }
        .neubrutalism:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 #000000;
        }
        .neubrutalism-button {
            background-color: #FFD166;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0 #000000;
            transition: all 0.2s ease;
        }
        .neubrutalism-button:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 #000000;
        }
        .neubrutalism-input {
            background-color: #ffffff;
            border: 3px solid #000000;
            box-shadow: 3px 3px 0 #000000;
            transition: all 0.2s ease;
        }
        .neubrutalism-input:focus {
            outline: none;
            box-shadow: 5px 5px 0 #000000;
        }
        .product-card {
            transition: all 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .add-button {
            background-color: #FF6B6B;
        }
        .modal {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8">
            <div class="neubrutalism rounded-xl p-6 mb-4 bg-blue-200">
                <h1 class="text-4xl font-bold mb-2 text-center">Product Search</h1>
                <p class="text-center text-gray-700">Find pharmacy products and their stockists</p>
            </div>
        </header>

        <!-- Search Section -->
        <div class="neubrutalism rounded-xl p-6 mb-8 bg-yellow-100">
            <div class="flex flex-wrap gap-4">
                <input type="text" id="searchInput" placeholder="Search products..." 
                    class="flex-1 p-3 rounded-lg neubrutalism-input placeholder-gray-500">
                <button onclick="searchProducts()" class="px-6 py-3 neubrutalism-button font-bold text-black rounded-lg">
                    <i class="bi bi-search"></i> Search
                </button>
                <button onclick="openAddProductModal()" class="px-6 py-3 neubrutalism-button add-button font-bold text-black rounded-lg">
                    <i class="bi bi-plus-lg"></i> Add Product
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Products will be dynamically inserted here -->
        </div>
    </div>

    <!-- Add Product Modal -->
    <div id="addProductModal" class="fixed inset-0 modal hidden flex items-center justify-center p-4 z-50">
        <div class="neubrutalism rounded-xl p-6 bg-green-100 max-w-lg w-full">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Add New Product</h2>
                <button onclick="closeAddProductModal()" class="text-3xl font-bold">&times;</button>
            </div>
            <form id="addProductForm" class="space-y-4">
                <div>
                    <label class="block mb-1 font-bold">Product Name</label>
                    <input type="text" id="productName" class="w-full p-3 rounded-lg neubrutalism-input" required>
                </div>
                <div>
                    <label class="block mb-1 font-bold">Product Photo URL</label>
                    <input type="text" id="productPhoto" class="w-full p-3 rounded-lg neubrutalism-input" placeholder="https://example.com/image.jpg">
                </div>
                <div>
                    <label class="block mb-1 font-bold">Company</label>
                    <input type="text" id="productCompany" class="w-full p-3 rounded-lg neubrutalism-input" required>
                </div>
                <div>
                    <label class="block mb-1 font-bold">MRP</label>
                    <input type="text" id="productMRP" class="w-full p-3 rounded-lg neubrutalism-input" placeholder="₹99.00" required>
                </div>
                <div>
                    <label class="block mb-1 font-bold">Pack Size</label>
                    <input type="text" id="productPackSize" class="w-full p-3 rounded-lg neubrutalism-input" placeholder="10 tablets">
                </div>
                <div>
                    <label class="block mb-1 font-bold">Salt</label>
                    <input type="text" id="productSalt" class="w-full p-3 rounded-lg neubrutalism-input" placeholder="e.g., Acetaminophen 500mg">
                </div>
                
                <div>
                    <label class="block mb-1 font-bold">Stockists (one per line)</label>
                    <textarea id="productStockists" rows="5" class="w-full p-3 rounded-lg neubrutalism-input" placeholder="Stockist 1&#10;Stockist 2&#10;Stockist 3&#10;Stockist 4&#10;Stockist 5"></textarea>
                </div>
                
                <button type="submit" class="w-full px-6 py-3 neubrutalism-button font-bold bg-blue-300 text-black rounded-lg">
                    Save Product
                </button>
            </form>
        </div>
    </div>

    <script>
        // Product data with local storage persistence
        let products = JSON.parse(localStorage.getItem('pharmacyProducts')) || [
            {
                name: "Paracetamol",
                photo: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=800",
                company: "HealthCare Pharma",
                mrp: "₹99.00",
                packSize: "10 tablets",
                salt: "Acetaminophen 500mg",
                stockists: [
                    "Medical Store A",
                    "Pharmacy Plus",
                    "Health Corner",
                    "Med World",
                    "City Pharmacy"
                ]
            },
            {
                name: "Amoxicillin",
                photo: "https://images.unsplash.com/photo-1550572017-4fcdbb59cc32?w=800",
                company: "MediPharma",
                mrp: "₹150.00",
                packSize: "20 capsules",
                salt: "Amoxicillin 500mg",
                stockists: [
                    "City Pharmacy",
                    "Health Hub",
                    "MediPlus",
                    "LifeCare Meds",
                    "Central Medical"
                ]
            },
            {
                name: "Vitamin C",
                photo: "https://images.unsplash.com/photo-1626196340105-9e71f75622ed?w=800",
                company: "VitaHealth",
                mrp: "₹200.00",
                packSize: "30 tablets",
                salt: "Ascorbic Acid 500mg",
                stockists: [
                    "Wellness Store",
                    "Nutrition Hub",
                    "Health Corner",
                    "VitaPlus",
                    "MediMart"
                ]
            }
        ];

        function saveProducts() {
            localStorage.setItem('pharmacyProducts', JSON.stringify(products));
        }

        function createProductCard(product) {
            const randomColor = getRandomPastelColor();
            return `
                <div class="neubrutalism rounded-xl p-6 product-card" style="background-color: ${randomColor}">
                    <img src="${product.photo || 'https://images.unsplash.com/photo-1512069772995-ec65ed45afd6?w=800'}" alt="${product.name}" 
                         class="w-full h-48 object-cover rounded-lg mb-4 border-2 border-black">
                    <h2 class="text-xl font-bold mb-2">${product.name}</h2>
                    <p class="mb-1"><strong>Company:</strong> ${product.company}</p>
                    <p class="mb-1"><strong>MRP:</strong> ${product.mrp}</p>
                    <p class="mb-1"><strong>Pack Size:</strong> ${product.packSize || 'N/A'}</p>
                    <p class="mb-3"><strong>Salt:</strong> ${product.salt || 'N/A'}</p>
                    <div class="border-t-2 border-black pt-3">
                        <h3 class="font-bold mb-2">Available at:</h3>
                        <ul>
                            ${product.stockists.map(stockist => `
                                <li class="flex items-center gap-2 mb-1">
                                    <i class="bi bi-shop"></i>
                                    ${stockist}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
        }

        function getRandomPastelColor() {
            const colors = [
                '#FFD6E0', '#FFEFCF', '#D1F5FF', '#C9F7CF', '#F1E0FF',
                '#FFF9C9', '#E0F8FF', '#FFE4CC', '#D5F5E3', '#F2D7D9'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) ||
                product.company.toLowerCase().includes(searchTerm) ||
                (product.salt && product.salt.toLowerCase().includes(searchTerm))
            );

            if (filteredProducts.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="col-span-full text-center text-xl p-10 neubrutalism bg-red-100">
                        <i class="bi bi-exclamation-circle text-2xl mb-2"></i>
                        <p>No products found. Try a different search term.</p>
                    </div>
                `;
                return;
            }

            filteredProducts.forEach(product => {
                resultsContainer.innerHTML += createProductCard(product);
            });
        }

        function openAddProductModal() {
            document.getElementById('addProductModal').classList.remove('hidden');
        }

        function closeAddProductModal() {
            document.getElementById('addProductModal').classList.add('hidden');
        }

        // Form submission
        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const name = document.getElementById('productName').value;
            const photo = document.getElementById('productPhoto').value;
            const company = document.getElementById('productCompany').value;
            const mrp = document.getElementById('productMRP').value;
            const packSize = document.getElementById('productPackSize').value;
            const salt = document.getElementById('productSalt').value;
            
            // Process stockists (split by new lines and filter empty lines)
            const stockistsText = document.getElementById('productStockists').value;
            const stockists = stockistsText.split('\n')
                .map(stockist => stockist.trim())
                .filter(stockist => stockist.length > 0)
                .slice(0, 5); // Only take up to 5 stockists
            
            // Add new product
            products.push({
                name,
                photo,
                company,
                mrp,
                packSize,
                salt,
                stockists
            });
            
            // Save and reset
            saveProducts();
            closeAddProductModal();
            document.getElementById('addProductForm').reset();
            
            // Refresh display
            displayAllProducts();
        });

        function displayAllProducts() {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';
            products.forEach(product => {
                resultsContainer.innerHTML += createProductCard(product);
            });
        }

        // Close modal when clicking outside
        document.getElementById('addProductModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAddProductModal();
            }
        });

        // Initial load
        window.onload = displayAllProducts;
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
